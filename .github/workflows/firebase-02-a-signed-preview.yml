name: FIREBASE-02-A unsigned preview AAB (no publish)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/firebase-02-a-signed-preview.yml'
      - 'app/**'
      - 'scripts/configure_firebase.py'

permissions:
  contents: read

concurrency:
  group: homecrew-firebase-02-a-unsigned-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unsigned-preview:
    if: >-
      github.repository == 'hebi10/HomeCrew' &&
      github.event.pull_request.number == 28 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_VERSION_CODE: '14'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require the exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install HomeCrew OAuth config (never expose upload key)
        env:
          HOMECREW_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.HOMECREW_GOOGLE_SERVICES_JSON_BASE64 }}
        run: python3 scripts/configure_firebase.py --required
      - name: Install release build SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build untrusted PR source without signing credentials
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache lintRelease bundleRelease
      - name: Preserve unsigned bundle for trusted main signing
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          unzip -t app/build/outputs/bundle/release/app-release.aab >/dev/null
          echo "Unsigned review AAB created. No upload certificate was present in this job." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned AAB (not usable for Play until signed)
        uses: actions/upload-artifact@v4
        with:
          name: homecrew-firebase02a-unsigned-v14-${{ github.event.pull_request.head.sha }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Record trusted promotion boundary
        run: |
          echo "This PR workflow cannot access the google-play environment or release signing keys." >> "$GITHUB_STEP_SUMMARY"
          echo "No bundle was uploaded to Google Play. A separately approved main-branch job must sign and publish this exact artifact." >> "$GITHUB_STEP_SUMMARY"
