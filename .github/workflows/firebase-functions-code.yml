name: Firebase callable function code QA

on:
  pull_request:
    paths:
      - 'functions/**'
      - '.github/workflows/firebase-functions-code.yml'
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/firebase-functions-code.yml'

permissions:
  contents: read

jobs:
  functions-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix functions install --no-audit --no-fund
      - run: npm --prefix functions test
