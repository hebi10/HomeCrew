name: Shared household emulator QA

on:
  pull_request:
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'tests/shared-households.emulator.test.mjs'
      - 'package.json'
      - '.github/workflows/shared-household-emulator.yml'
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'tests/shared-households.emulator.test.mjs'
      - 'package.json'
      - '.github/workflows/shared-household-emulator.yml'

permissions:
  contents: read

jobs:
  local-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm --prefix functions install --no-audit --no-fund
      - name: Verify shared household operations using demo emulators only
        env:
          GCLOUD_PROJECT: demo-homecrew-shared-ci
        run: npm run test:shared-households
