name: HomeCrew screen QA

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/screenshot-qa.yml'
      - '.github/scripts/capture-screenshots.sh'
      - 'scripts/configure_firebase.py'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/screenshot-qa.yml'
      - '.github/scripts/capture-screenshots.sh'
      - 'scripts/configure_firebase.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homecrew-screen-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Install HomeCrew Firebase configuration
        env:
          HOMECREW_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.HOMECREW_GOOGLE_SERVICES_JSON_BASE64 }}
        run: python3 scripts/configure_firebase.py ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '--required' || '' }}
      - name: Enable KVM for Android emulator
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm unavailable; cannot run hardware-accelerated emulator."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Capture four tabs on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -accel on
          script: bash .github/scripts/capture-screenshots.sh
      - name: Upload UI screenshots and instrumentation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homecrew-1b-screen-qa
          path: |
            qa-screenshots/*.png
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
