name: Privacy policy Pages

on:
  workflow_dispatch:
    inputs:
      publish_approval:
        description: 'Explicit approval to publish HomeCrew privacy and deletion pages'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homecrew-privacy-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.publish_approval == 'HOMECREW_PRIVACY_PAGES_APPROVED'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Prepare public account policy documents
        run: |
          mkdir -p _site
          cp docs/privacy-policy.html _site/privacy-policy.html
          cp docs/delete-account.html _site/delete-account.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish policy
        id: deployment
        uses: actions/deploy-pages@v4
