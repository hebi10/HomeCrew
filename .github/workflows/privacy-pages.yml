name: Privacy policy Pages

on:
  push:
    branches: [main]
    paths: ['docs/privacy-policy.html', '.github/workflows/privacy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homecrew-privacy-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Prepare public policy only
        run: |
          mkdir -p _site
          cp docs/privacy-policy.html _site/privacy-policy.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish policy
        id: deployment
        uses: actions/deploy-pages@v4
