name: HomeCrew ko-KR store listing ASSET-02 — manual only
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check validates text only; apply updates only ko-KR descriptions after approval'
        type: choice
        required: true
        default: check
        options: [check, apply]
      ops01_release_approved:
        description: 'All planned work/QA complete and Play store change approved'
        required: true
        type: boolean
        default: false
      ops06_store_approved:
        description: 'Separately approve the exact reviewed ko-KR text update'
        required: true
        type: boolean
        default: false
      ops06_confirmation:
        description: 'For apply type APPLY_VERIFIED_PLAY_STORE_ASSETS'
        required: false
        type: string
      ops06_expected_main_sha:
        description: 'Exact reviewed current main commit SHA'
        required: false
        type: string
      ops06_batch_id:
        description: 'KST release batch YYYY-MM-DD-homecrew'
        required: false
        type: string
      homecrew_final_approval:
        description: 'For apply type HOMECREW_FINAL_RELEASE_APPROVED'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: play-com-hebi-homecrew
  cancel-in-progress: false
jobs:
  validate:
    name: Offline Korean listing text checks
    if: github.repository == 'hebi10/HomeCrew' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate wording and protect all other Play metadata without credentials
        run: |
          python3 -m unittest discover -s scripts/play/tests -p 'test_listing_ko.py'
          python3 scripts/play/listing_ko.py --mode validate
      - uses: actions/upload-artifact@v4
        with:
          name: homecrew-ko-kr-text-review-${{ github.run_id }}
          path: output/homecrew-listing-ko-asset02.json
          retention-days: 30
          if-no-files-found: error

  apply:
    name: Apply reviewed Korean descriptions only after separate user approval
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.repository == 'hebi10/HomeCrew' && inputs.mode == 'apply' &&
      inputs.ops01_release_approved == true && inputs.ops06_store_approved == true &&
      inputs.homecrew_final_approval == 'HOMECREW_FINAL_RELEASE_APPROVED'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: google-play
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: OPS-06 approve exact source, KST batch and store text scope
        env:
          GH_TOKEN: ${{ github.token }}
          OPS06_STORE_APPROVED: ${{ inputs.ops06_store_approved }}
          OPS06_CONFIRMATION: ${{ inputs.ops06_confirmation }}
          OPS06_EXPECTED_MAIN_SHA: ${{ inputs.ops06_expected_main_sha }}
          OPS06_BATCH_ID: ${{ inputs.ops06_batch_id }}
        run: python3 scripts/ops06/store_gate.py apply
      - name: Revalidate exact Korean text before Play authorization
        run: |
          python3 -m unittest discover -s scripts/play/tests -p 'test_listing_ko.py'
          python3 scripts/play/listing_ko.py --mode validate
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Commit ko-KR description changes only and verify fresh readback
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 scripts/play/listing_ko.py --mode apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homecrew-ko-kr-text-approval-${{ github.run_id }}
          path: output/homecrew-listing-ko-asset02.json
          retention-days: 30
          if-no-files-found: warn
