name: Settings targeted regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/androidTest/java/com/hebi/homecrew/qa/HomeCrewActivityRestartTest.kt'
      - 'app/src/androidTest/java/com/hebi/homecrew/qa/MainScreensScreenshotTest.kt'
      - '.github/workflows/settings-regression.yml'
permissions:
  contents: read
concurrency:
  group: homecrew-settings-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  scope:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cases: ${{ steps.select.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          paths = set(subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"]],
              text=True,
          ).splitlines())
          prefix = "app/src/androidTest/java/com/hebi/homecrew/qa/"
          cases = []
          if prefix + "HomeCrewActivityRestartTest.kt" in paths:
              cases.append({"label": "member-persistence", "font": "1.0", "test": "com.hebi.homecrew.qa.HomeCrewActivityRestartTest#householdSettingsPersistAfterActivityRestart"})
          if prefix + "MainScreensScreenshotTest.kt" in paths:
              cases.append({"label": "account-large-font", "font": "1.6", "test": "com.hebi.homecrew.qa.MainScreensScreenshotTest#captureMainTabsAndBasicInteractions"})
          print("cases=" + json.dumps(cases, separators=(",", ":")))
          PY
  targeted:
    needs: scope
    if: needs.scope.outputs.cases != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.cases) }}
    name: API35 ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Install HomeCrew Firebase configuration
        env:
          HOMECREW_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.HOMECREW_GOOGLE_SERVICES_JSON_BASE64 }}
        run: python3 scripts/configure_firebase.py --required
      - name: Verify OAuth resource for account regression
        if: matrix.label == 'account-large-font'
        run: |
          ./gradlew --no-daemon :app:processDebugGoogleServices
          if ! grep -rq 'name="default_web_client_id"' app/build/generated/res/google-services/; then
            echo "::error::Google OAuth resource is missing; account regression cannot be skipped."
            exit 1
          fi
      - name: Enable KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is unavailable."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run selected instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FONT_SCALE: ${{ matrix.font }}
          TEST_CASE: ${{ matrix.test }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -accel on
          script: |
            adb shell settings put system font_scale "$FONT_SCALE"
            adb shell cmd uimode night no
            ./gradlew --no-daemon connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=$TEST_CASE" --stacktrace
      - name: Verify selected test actually ran
        env:
          TEST_CASE: ${{ matrix.test }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          classname, method = os.environ["TEST_CASE"].split("#")
          matches = [
              case
              for report in Path("app/build/outputs/androidTest-results/connected").rglob("*.xml")
              for case in ElementTree.parse(report).iter("testcase")
              if case.get("classname") == classname and case.get("name") == method
          ]
          if not matches or any(child.tag in {"skipped", "failure", "error"} for case in matches for child in case):
              raise SystemExit("Selected instrumentation test did not pass.")
          print("Selected regression passed.")
          PY
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homecrew-settings-${{ matrix.label }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn
