name: Firestore Security Rules CI

on:
  pull_request:
    paths:
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'tests/firestore.rules.test.mjs'
      - 'package.json'
      - '.github/workflows/firestore-security.yml'
  push:
    branches: [main]
    paths:
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'tests/firestore.rules.test.mjs'
      - 'package.json'
      - '.github/workflows/firestore-security.yml'

permissions:
  contents: read

jobs:
  security-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - name: Test security rules against local emulator only
        run: npm run test:firestore
